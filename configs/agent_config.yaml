# Agent Configuration

# LLM Provider settings
llm:
  # Provider: openai, groq, or anthropic
  provider: openai
  
  # Model name (leave empty for defaults)
  # OpenAI: gpt-3.5-turbo, gpt-4, gpt-4-turbo
  # Groq: llama-3.3-70b-versatile, llama-3.1-8b-instant
  # Anthropic: claude-3-haiku-20240307, claude-3-sonnet-20240229
  model: gpt-3.5-turbo
  
  # API key (or use environment variable)
  # For OpenAI: export OPENAI_API_KEY=your_key
  # For Groq: export GROQ_API_KEY=your_key
  # For Anthropic: export ANTHROPIC_API_KEY=your_key
  api_key: null
  
  # Maximum reasoning iterations
  max_iterations: 5
  
  # Verbose output (show reasoning steps)
  verbose: true

# Weather data settings
weather:
  # Default locations for quick access
  default_locations:
    - Ceuta
    - Tangier
    - Casablanca
    - Rabat
    
  # Weather API settings
  api:
    # Open-Meteo API (free, no key required)
    open_meteo_url: https://api.open-meteo.com/v1/forecast
    
    # Request timeout (seconds)
    timeout: 10
    
  # Aircraft type defaults for safety assessment
  aircraft_types:
    helicopter:
      max_wind_ms: 20
      max_gusts_ms: 25
      min_visibility_km: 5
    small_plane:
      max_wind_ms: 15
      max_gusts_ms: 20
      min_visibility_km: 8
    commercial:
      max_wind_ms: 25
      max_gusts_ms: 30
      min_visibility_km: 3

# Chat interface settings
chat:
  # Show welcome message
  show_welcome: true
  
  # Auto-save conversation history
  save_history: false
  history_file: agent_conversations.json
